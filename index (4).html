<style>

<script>
const $=id=>document.getElementById(id);
const HOUR=3600000,DAY=86400000;
let loc=null,H=null,offSec=0,T=[],D=[],staleTs=0;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const pad=n=>String(n).padStart(2,'0');
const nowLoc=()=>Date.now()+offSec*1000;
function tick(){const d=new Date(nowLoc());$('clock').textContent=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());$('clockDay').textContent=d.toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
setInterval(tick,15000);tick();

const wxIcon=hs=>{
if(!hs.length)return'cloud';
const pp=max(hs,'pp'),mm=hs.reduce((s,h)=>s+h.mm,0),cl=avg(hs,'cloud'),sun=avg(hs,'sun');
if(pp>=50||mm>=0.2)return'rain';
if(sun<15)return cl<40?'moon':cl<75?'moonc':'cloud';
return cl<25?'sun':cl<65?'part':'cloud'};
const icon=hs=>`<svg class="wi" viewBox="0 0 48 48" aria-hidden="true"><use href="#w-${wxIcon(hs)}"/></svg>`;

function dryH(hs){
if(!hs.length)return null;
const pp=max(hs,'pp'),mm=hs.reduce((q,h)=>q+h.mm,0);
if(pp>=50||mm>=0.2)return null;
return 4/(0.15+0.5*avg(hs,'vpd')+0.015*avg(hs,'wind')+0.0008*avg(hs,'sun'))}
const fmtH=t=>t>12?'12h+':Math.max(1,Math.round(t))+'h';
function waitH(st){const d=D.find(x=>st>=x.r-6*HOUR&&st<x.s);return d&&st<d.r+HOUR?(d.r+HOUR-st)/HOUR:0}
function dry(hs,st){const t=dryH(hs);return t===null?'—':fmtH(t+waitH(st))}

function hoursIn(s,e){const o=[];for(let i=0;i<T.length;i++)if(T[i]>=s&&T[i]<e)o.push({temp:H.temperature_2m[i],hum:H.relative_humidity_2m[i],pp:H.precipitation_probability[i]||0,mm:H.precipitation[i]||0,wind:H.wind_speed_10m[i]||0,gust:H.wind_gusts_10m[i]||0,sun:H.shortwave_radiation[i]||0,cloud:H.cloud_cover[i]||0,vpd:H.vapour_pressure_deficit[i]||0});return o}
const avg=(a,k)=>a.reduce((s,h)=>s+Number(h[k]||0),0)/Math.max(1,a.length);
const max=(a,k)=>Math.max(...a.map(h=>Number(h[k]||0)));

function evaluate(hs){
if(!hs.length)return{kind:'bad',label:'Sem dados',note:'Não há previsão para este período.',hs};
const pp=max(hs,'pp'),mm=hs.reduce((s,h)=>s+h.mm,0),gust=max(hs,'gust'),wind=avg(hs,'wind'),vpd=avg(hs,'vpd'),temp=avg(hs,'temp'),sun=avg(hs,'sun'),cloud=avg(hs,'cloud'),hum=avg(hs,'hum');
if(pp>=50||(mm>=0.2&&pp>=20))return{kind:'bad',label:'Evita',note:'Chuva prevista ou risco elevado de aguaceiros.',hs};
if(sun<15){if(vpd>=0.9&&wind>=3&&temp>=14&&pp<25)return{kind:'medium',label:'Arrisca!',note:'Pode secar, mas devagar e sem sol.',hs};return{kind:'bad',label:'Evita',note:'Sem sol o ar fica húmido e a roupa não seca.',hs}}
if((hum>=85&&wind<8)||(vpd<0.2&&wind<12))return{kind:'bad',label:'Evita',note:'Muita humidade e pouco vento: a roupa não seca.',hs};
let s=0;s+=sun>=250?3:sun>=100?2:sun>=35?1:0;s+=wind>=5&&wind<=28?2:wind>=3?1:0;s+=vpd>=1.2?3:vpd>=0.7?2:vpd>=0.35?1:0;if(temp>=16)s++;if(cloud<50)s++;
if(pp>=25)return{kind:'medium',label:'Arrisca!',note:'Alguma hipótese de chuva. Fica atento.',hs};
if(gust>=55)return{kind:'medium',label:'Arrisca!',note:'Rajadas fortes: prende bem a roupa.',hs};
if(s>=6&&hum>=75&&wind<6)return{kind:'medium',label:'Arrisca!',note:'Humidade alta e pouco vento: vai demorar.',hs};
if(s>=6)return{kind:'good',label:'Aproveita!',note:'Boas condições para secar.',hs};
if(s>=3)return{kind:'medium',label:'Arrisca!',note:'Vai secar, mas com calma.',hs};
return{kind:'bad',label:'Evita',note:'Ar húmido e pouco vento: a roupa não seca.',hs}}

const SHORT={good:'Aproveita',medium:'Arrisca',bad:'Evita'};
const hh=ms=>pad(new Date(ms).getUTCHours())+'h';

function render(){
if(!H)return;
const n=nowLoc(),d=new Date(n);
const dayStart=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
const base=Math.floor(n/HOUR)*HOUR;
const blocks=[];
for(let i=0;i<4;i++){const s=base+i*6*HOUR,e=s+6*HOUR;const ev=evaluate(hoursIn(s,e));ev.s=s;ev.e=e;ev.i=i;ev.tag=i===0?'Agora':(s>=dayStart+DAY?'Amanhã':'Hoje');blocks.push(ev)}

const nowEv=evaluate(hoursIn(base,base+3*HOUR));
let kind=nowEv.kind,verdict=nowEv.label,note=kind==='good'?'Agora estão boas condições para secar roupa.':kind==='medium'?'Dá para tentar, mas acompanha o céu.':'Neste momento não é boa altura para estender.';
const dh0=dryH(nowEv.hs);const dh=dh0===null?null:dh0+waitH(base);let sunBad=false;
const dia=D.find(x=>x.r<=n&&n<x.s);
const ss=dia?pad(new Date(dia.s).getUTCHours())+'h'+pad(new Date(dia.s).getUTCMinutes()):'';
if(kind!=='bad'&&dh!==null){
const left=dia?(dia.s-n)/HOUR:null;
if(left!==null&&left<1){kind='bad';verdict='Evita';note=`O sol põe-se às ${ss}. Já é tarde para estender hoje.`;sunBad=true}
else if(left!==null&&dh>left-0.5){const aviso=`Seca em ${fmtH(dh)}, mas o sol põe-se às ${ss}. Pode não chegar a secar.`;if(kind==='good'){kind='medium';verdict='Arrisca!';note=aviso}else note+=' '+aviso}
else{note+=` Seca em ${fmtH(dh)}${left!==null?`, antes do pôr do sol (${ss})`:''}.`}
}
const nextGood=blocks.slice(1).find(b=>b.kind==='good');
const hm=ms=>pad(new Date(ms).getUTCHours())+'h'+pad(new Date(ms).getUTCMinutes());
const nextRise=D.find(x=>x.r>n);
if(kind==='bad'&&nextGood&&!sunBad){kind='medium';verdict='Espera um pouco';note=`Melhor janela: ${hh(nextGood.s)} – ${hh(nextGood.e)}.`}
if(!dia&&nextRise){if(verdict==='Espera um pouco')note=`O sol nasce às ${hm(nextRise.r)}. `+note;else if(kind==='bad')note=`É de noite. O sol nasce às ${hm(nextRise.r)}.`}
let rainAt=null;for(let i=0;i<T.length;i++){if(T[i]>=n&&T[i]<n+14*HOUR&&(H.precipitation_probability[i]>=50||H.precipitation[i]>=0.2)){rainAt=T[i];break}}
const gust=Math.max(...blocks.slice(0,2).flatMap(b=>b.hs.map(h=>h.gust)),0);
let tip='',sev=false,ok=false;
if(nowEv.kind!=='bad'&&rainAt){tip=`🌧️ Chuva prevista por volta das ${hh(rainAt)}. Recolhe a roupa antes.`}
else if(gust>=65){tip=`⚠️ Rajadas muito fortes, até ${Math.round(gust)} km/h. Evita estender no exterior.`;sev=true}
else if(gust>=50){tip=`💨 Vento forte, rajadas até ${Math.round(gust)} km/h. Prende bem a roupa.`}
else{const gn=Math.round(max(nowEv.hs,'gust'));if(kind==='good'&&gn>=20){tip=`💨 Rajadas até ${gn} km/h. Ajudam a secar!`;ok=true}}
if(staleTs){const q=new Date(staleTs);tip=`📡 Sem ligação. A mostrar a previsão guardada às ${pad(q.getHours())}:${pad(q.getMinutes())}.`;sev=false}
const sunNow=hoursIn(base,base+HOUR)[0]?.sun??100;
document.body.dataset.sky=sunNow<5?'night':kind;
document.querySelector('meta[name="theme-color"]').content=sunNow<5?'#0e1a3a':{good:'#2f7fd6',medium:'#4f7a9c',bad:'#46566a'}[kind];
$('heroBox').className='glass hero h-'+kind;
$('heroBox').innerHTML=`${icon(nowEv.hs)}<div><div class="verdict ${kind}">${verdict}</div><p>${note}</p></div>`;
const dd=D.find(x=>x.s>n);$('sun').innerHTML=dd?`${dd.r>=dayStart+DAY?'amanhã ':''}<svg class="si" aria-label="Nascer do sol"><use href="#w-rise"/></svg>${hm(dd.r)} &nbsp;·&nbsp; <svg class="si" aria-label="Pôr do sol"><use href="#w-set"/></svg>${hm(dd.s)}`:'';
const t=$('tip');t.hidden=!tip;t.textContent=tip;t.className='tip'+(sev?' severe':ok?' ok':'');

$('blocks').innerHTML=blocks.map(b=>{const h=b.hs;return `<div class="glass block ${b.i===0?'now':''}"><div class="t">${pad(new Date(b.s).getUTCHours())}–${hh(b.e)}</div><div class="d">${b.tag}</div>${icon(h)}<div class="lab ${b.kind}">${SHORT[b.kind]}</div><div class="st">${h.length?`${Math.round(avg(h,'temp'))}° · 💨${Math.round(avg(h,'wind'))}<br>🌧️ ${Math.round(max(h,'pp'))}%<br><b>seca em ${b.kind==='bad'?'—':dry(h,b.s)}</b>`:''}</div></div>`}).join('');

let days='';
for(let k=1;k<=3;k++){const ds=dayStart+k*DAY;
const dt=new Date(ds);const wd=dt.toLocaleDateString('pt-PT',{weekday:'short',timeZone:'UTC'}).replace('.','');const dm=dt.toLocaleDateString('pt-PT',{day:'numeric',month:'short',timeZone:'UTC'}).replace('.','');
const slots=[['Manhã',8,13],['Tarde',13,19]].map(([nm,a,b])=>{const ev=evaluate(hoursIn(ds+a*HOUR,ds+b*HOUR));const h=ev.hs;return `<div class="slot">${icon(h)}<div><div class="n">${nm}</div><div class="lab ${ev.kind}">${SHORT[ev.kind]}</div><div class="st">${h.length?`${Math.round(avg(h,'temp'))}° · 🌧️ ${Math.round(max(h,'pp'))}%<br>💨 ${Math.round(avg(h,'wind'))} km/h`:''}</div></div></div>`}).join('');
days+=`<div class="glass day"><div class="dn">${k===1?'Amanhã':wd}<small>${dm}</small></div>${slots}</div>`}
$('days').innerHTML=days;tick()}

async function fj(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('http');return await r.json()}finally{clearTimeout(t)}}
async function forecast(){
if(!loc)return;
try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,shortwave_radiation,cloud_cover,vapour_pressure_deficit&daily=sunrise,sunset&forecast_days=5&timezone=auto`;
const r=await fj(u);H=r.hourly;offSec=r.utc_offset_seconds||0;T=H.time.map(t=>Date.parse(t+':00Z'));D=((r.daily&&r.daily.sunrise)||[]).map((t,i)=>({r:Date.parse(t+':00Z'),s:Date.parse(r.daily.sunset[i]+':00Z')}));staleTs=0;store('seca-last',JSON.stringify({H,D,offSec,ts:Date.now(),lat:loc.lat,lon:loc.lon}));render()}
catch(e){if(!H){try{const o=JSON.parse(store('seca-last')||'null');if(o&&o.lat===loc.lat&&o.lon===loc.lon){H=o.H;D=o.D||[];offSec=o.offSec;T=H.time.map(t=>Date.parse(t+':00Z'));staleTs=o.ts;render();return}}catch(x){}}
if(!H){$('heroBox').innerHTML='<div class="msg">Não foi possível consultar a meteorologia.<br><button id="retry">Tentar novamente</button></div>';$('retry').onclick=forecast}}}
function setLoc(l){loc=l;$('locName').textContent=l.name;store('seca-loc',JSON.stringify(l));$('modal').classList.remove('open');H=null;$('heroBox').innerHTML='<div class="msg">A consultar a meteorologia…</div>';forecast()}
async function revGeo(lat,lon){try{const d=await fj(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);const a=d.address||{};return(a.city||a.town||a.village||a.suburb||'Localização atual')+(a.country?', '+a.country:'')}catch(e){return'Localização atual'}}
function gps(){if(!navigator.geolocation){$('help').textContent='Este dispositivo não permite obter a localização.';return}
$('help').textContent='A obter a localização…';
navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;setLoc({lat,lon,name:await revGeo(lat,lon)})},()=>{$('help').textContent='Sem acesso à localização. Escreve uma localidade.'},{timeout:12000,maximumAge:300000})}
async function search(){const q=$('place').value.trim();if(!q){$('help').textContent='Escreve primeiro uma localidade.';return}
$('help').textContent='A procurar…';
try{const d=await fj(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=pt&format=json`);if(!d.results?.length){$('help').textContent='Não encontrei essa localidade.';return}
const r=d.results[0];setLoc({lat:r.latitude,lon:r.longitude,name:[r.name,r.country].filter(Boolean).join(', ')})}catch(e){$('help').textContent='Falhou a pesquisa. Verifica a ligação.'}}
$('locBtn').onclick=()=>$('modal').classList.add('open');
$('close').onclick=()=>$('modal').classList.remove('open');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
$('search').onclick=search;$('gps').onclick=gps;$('place').addEventListener('keydown',e=>{if(e.key==='Enter')search()});

let saved=null;try{saved=JSON.parse(store('seca-loc')||'null')}catch(e){}
if(saved&&saved.lat!=null){loc=saved;$('locName').textContent=saved.name;forecast()}
else{loc={lat:38.7223,lon:-9.1393,name:'Lisboa, Portugal'};$('locName').textContent=loc.name;$('help').textContent='A mostrar Lisboa. Procura a tua localidade ou usa a tua localização.';$('modal').classList.add('open');forecast()}
setInterval(render,60000);setInterval(forecast,30*60000);
</script>
</body>
